name: ingest

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm

      - run: npm ci

      - name: Coletar feeds
        run: npm run ingest

      - name: Verificar
        run: |
          npm run type-check
          npx vitest run

      - name: Commitar dataset
        run: |
          git config user.name "groundbrnews-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- src/data/generated; then
            echo "Sem mudanças no dataset."
            exit 0
          fi
          git add src/data/generated
          git commit -m "chore(dados): coleta diária $(date -u +%F)"
          git pull --rebase
          git push
