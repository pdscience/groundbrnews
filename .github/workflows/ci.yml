name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npx vitest run

      - run: npm run build
